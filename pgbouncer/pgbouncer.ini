[databases]
brain = host=localhost dbname=brain

[pgbouncer]
listen_port = 5433
listen_addr = 127.0.0.1
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
server_reset_query = RESET ALL
log_connections = 0
log_disconnections = 0
