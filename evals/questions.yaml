# Eval questions grounded in real Slack data (#engineering channel).
#
# Ground truth from episodes:
#   "We're using Supabase for the database"
#   "Launch is scheduled for July 10th"  (later pushed: "Launch is pushed to July 5th")
#   "Jai owns the onboarding flow"
#   "We decided to go with React Native for the mobile app"
#   "i dont want anyone to be lagging on the deadlines make sure you guys
#    create ai Agents to make your work easier"
#   channel renamed from "all-aa-bot-notifier" to "engineering"
#
# Schema per question:
#   id                             — stable identifier
#   category                       — decision | ownership | status | technical |
#                                    not_sure | shared_fact | calibration
#   question                       — the natural-language query
#   expected_answer_contains       — substring that must appear in synthesized answer (case-insensitive)
#                                    empty string "" means no substring requirement (pair with expect_not_sure)
#   expected_source_fact_summary_contains — substring expected in at least one retrieved fact summary
#   expect_not_sure                — true: system should abstain / report low confidence
#   expected_fact_keywords         — list of keywords; at least one retrieved fact summary must
#                                    contain at least one of these (checked case-insensitively)
#                                    empty list [] skips this check
#   answerable                     — true: a correct answer exists in the knowledge base
#   difficulty                     — easy | medium | hard
#     easy:   direct keyword match expected
#     medium: requires inference or synonym matching
#     hard:   temporal reasoning, contradiction surfacing, or multi-hop
#
# Categories: decision, ownership, technical, status, not_sure, calibration

