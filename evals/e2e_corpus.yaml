# End-to-end benchmark corpus for Thread: RAW messages in, answers out.
#
# Unlike evals/corpus.yaml (which hands the system finished facts), this is what
# connectors actually deliver: emails, chat threads and meeting notes with chatter,
# quoted text, buried facts, updates that arrive weeks later, near-duplicates,
# decoys, noise, and attempts to hijack the model. The system must ingest, filter,
# extract (with a real model), reconcile, retrieve and answer, and every stage is
# scored.
#
# Fictional company "Meridian Labs"; nothing here is real.
#
# Ground truth
#   claims     what a correct extractor must capture from an episode. `all` lists
#              tokens that must ALL appear (case-insensitive, word-bounded) in the
#              extracted fact's text. `updates` names an earlier claim this one
#              replaces. `decoy_of` marks a claim that resembles another but must
#              not replace it.
#   expect     how ingestion should treat the episode: `dropped` (noise filter),
#              `duplicate` (identical to an earlier episode), `no_facts` (kept, but
#              nothing worth remembering).
#   questions  asked after the whole timeline has been processed.

