# Quality gate for evals/bench.py, enforced by tests/test_regression.py.
#
# Each metric has two checks:
#   floor      hard limit regardless of baseline (a ceiling when direction is
#              lower_is_better). Set a safe margin below the measured value so
#              ordinary run-to-run variation does not fail a build.
#   tolerance  how far the metric may move in the bad direction relative to
#              evals/baseline.json before it is flagged as a regression.
#
# Keys are flat names resolved against the benchmark output; see
# tests/test_regression.py::_value. Baseline values come from
# `python -m evals.aggregate --write-baseline`.
#
# `retrieval` needs a local database and an embedding key but no chat model.
# `llm` costs tokens and is not deterministic, so it runs only with BENCH_LLM=1.

retrieval:
  retrieval.production.hit@5:
    floor: 0.90
    tolerance: 0.05
  retrieval.production.recall@5:
    floor: 0.90
    tolerance: 0.05
  retrieval.production.mrr:
    floor: 0.85
    tolerance: 0.05
  retrieval.production.ndcg@5:
    floor: 0.85
    tolerance: 0.05

llm:
  answers.answer_correct:
    floor: 0.90
    tolerance: 0.08
  answers.faithfulness:
    floor: 0.85
    tolerance: 0.08
  answers.citation_support:
    floor: 0.90
    tolerance: 0.08
  answers.abstention:
    floor: 0.80
    tolerance: 0.10

  supersession.reconcile.supersession_recall:
    floor: 0.80
    tolerance: 0.10
  supersession.reconcile.supersession_precision:
    floor: 0.70
    tolerance: 0.10
  supersession.reconcile.duplicate_detection:
    floor: 0.75
    tolerance: 0.15
  supersession.reconcile.decoy_false_actions:
    direction: lower_is_better
    floor: 0.20
    tolerance: 0.10

  end_to_end.reconcile.chains_fully_correct:
    floor: 0.70
    tolerance: 0.15
  end_to_end.reconcile.current_top1_is_latest:
    floor: 0.75
    tolerance: 0.15
  end_to_end.reconcile.current_answer_latest_only:
    floor: 0.75
    tolerance: 0.15
