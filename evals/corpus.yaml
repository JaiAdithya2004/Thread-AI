# Facts that change over time. Versions are listed oldest to newest. Subjects are
# written the way an extraction model varies them (sometimes identical, often
# not), because exact subject equality is what the previous approach relied on.
chains:
  - id: c01
    current_q: "What is the current monthly price of the Pro plan?"
    history_q: "How has the Pro plan price changed over time?"
    versions:
      - {subject: "Pro plan", text: "The Pro plan costs $20 per month.", value: "$20"}
      - {subject: "Pro plan pricing", text: "The Pro plan price was raised to $29 per month.", value: "$29"}
      - {subject: "Pro plan", text: "The Pro plan price is now $35 per month.", value: "$35"}
