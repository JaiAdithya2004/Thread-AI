# Synthetic benchmark corpus for Thread.
#
# Everything here is fictional ("Meridian Labs") so the benchmark is public and
# reproducible: no personal data, no external services needed to seed it.
#
# Ground truth is explicit and independent of retrieval. Each question lists the
# fact keys a correct system must return, decided by reading this file -- not by
# running a query and filtering what came back.
#
# Sections
#   facts        static knowledge base (retrieval + answer-quality benchmark)
#   questions    answerable questions with gold fact keys and expected answer text
#   unanswerable questions the corpus cannot answer (abstention benchmark)
#   chains       facts that change over time (supersession benchmark)
#   decoys       similar-looking statements that must NOT replace anything
#   futures      future-dated changes (a known limitation, scored separately)
#   rewordings   paraphrases that SHOULD be detected as duplicates

facts:
  - {key: b01, subject: "Backend stack", summary: "The backend is written in Python 3.11 using FastAPI."}
  - {key: b02, subject: "Primary database", summary: "Meridian's primary database is PostgreSQL 15 hosted on managed instances."}
  - {key: b03, subject: "Search", summary: "Search uses pgvector for semantic similarity alongside Postgres full-text search."}
  - {key: b04, subject: "Frontend", summary: "The web app frontend is built with React and TypeScript."}
  - {key: b05, subject: "Production deploys", summary: "Production deploys require approval from two engineers."}
  - {key: b06, subject: "Error tracking", summary: "Application errors are tracked in Sentry."}
  - {key: b07, subject: "Incident process", summary: "Severity-1 incidents require a written postmortem within five business days."}
  - {key: b08, subject: "Code review", summary: "Every pull request needs one approving review before merge."}
  - {key: b09, subject: "Feature flags", summary: "Feature flags are managed through LaunchDarkly."}
  - {key: b10, subject: "Staging database", summary: "The staging database is refreshed from anonymized production data every Sunday."}
  - {key: b11, subject: "Free plan", summary: "The Free plan is limited to three projects and one user."}
  - {key: b12, subject: "Team plan", summary: "The Team plan costs $79 per seat per month."}
  - {key: b13, subject: "Enterprise support", summary: "Enterprise customers get a one-hour first-response support SLA."}
  - {key: b14, subject: "Data export", summary: "Customers can export all of their data as CSV or JSON from the settings page."}
  - {key: b15, subject: "Single sign-on", summary: "Single sign-on via SAML is available only on the Enterprise plan."}
  - {key: b16, subject: "iOS app", summary: "The iOS app requires iOS 16 or later."}
  - {key: b17, subject: "Audit logs", summary: "Audit logs are retained for 12 months on the Enterprise plan."}
  - {key: b18, subject: "Free trial", summary: "New workspaces get a 14-day free trial of the Team plan."}
  - {key: b19, subject: "Integrations", summary: "The product integrates with Slack, Jira and GitHub."}
  - {key: b20, subject: "Uptime", summary: "The contractual uptime commitment is 99.9 percent."}
  - {key: b21, subject: "Customer onboarding", summary: "Alice Chen owns the customer onboarding flow."}
  - {key: b22, subject: "Security lead", summary: "Dev Patel is the security lead and runs the quarterly access review."}
  - {key: b23, subject: "Hiring plan", summary: "The company plans to hire two backend engineers in the fourth quarter."}
  - {key: b24, subject: "Remote work", summary: "Employees may work remotely up to three days per week."}
  - {key: b25, subject: "Paid time off", summary: "Full-time employees get 25 days of paid time off per year."}
  - {key: b26, subject: "Company offsite", summary: "The annual company offsite is held in September."}
  - {key: b27, subject: "Spend approval", summary: "Rosa Gómez, the CFO, approves any spend above $10,000."}
  - {key: b28, subject: "Legal review", summary: "Contracts are reviewed by outside counsel at Hale & Brandt."}
  - {key: b29, subject: "Fiscal year", summary: "The fiscal year starts on April 1."}
  - {key: b30, subject: "Runway", summary: "The company has 22 months of runway at the current burn rate."}
  - {key: b31, subject: "Annual recurring revenue", summary: "Annual recurring revenue reached $4.2M at the end of last quarter."}
  - {key: b32, subject: "Largest customer", summary: "The largest customer is Northgate Logistics, at 11 percent of revenue."}
  - {key: b33, subject: "Pricing review", summary: "Pricing is reviewed once a year in January."}
  - {key: b34, subject: "Main competitor", summary: "The main competitor is Lumen Analytics."}
  - {key: b35, subject: "Target market", summary: "The primary target market is mid-size logistics companies in North America."}
  - {key: b36, subject: "2027 roadmap", summary: "The 2027 roadmap prioritizes a public API and usage-based billing."}
  - {key: b37, subject: "Brand", summary: "The brand color is deep teal."}
  - {key: b38, subject: "Standard support hours", summary: "Standard support is staffed Monday to Friday, 8am to 6pm Central."}
  - {key: b39, subject: "Compliance", summary: "The company completed its SOC 2 Type I audit in March."}
  - {key: b40, subject: "Database backups", summary: "Database backups run nightly and are retained for 35 days."}
  - {key: b41, subject: "Customer success", summary: "Customer success is led by Tomás Ribeiro."}
  - {key: b42, subject: "Product analytics", summary: "Product analytics are collected with Amplitude."}
  - {key: b43, subject: "Status page", summary: "The public status page is hosted at status.meridian.example."}
  - {key: b44, subject: "Data residency", summary: "Customer data is stored in the US region by default."}

