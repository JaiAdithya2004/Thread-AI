# Alembic configuration for Company Brain / Thread
# Run migrations: alembic upgrade head
# Generate new migration: alembic revision --autogenerate -m "description"

[alembic]
# Path to migration scripts
script_location = migrations

# Template used for new migration files (relative to script_location)
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Max chars for the "slug" portion of the file name
truncate_slug_length = 40

# The output encoding for revision files
output_encoding = utf-8

# Database URL — read from environment at runtime (see migrations/env.py)
# Setting a placeholder here; env.py overrides this from DATABASE_URL
sqlalchemy.url = postgresql://brain:brain_local@localhost:5432/brain


[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
